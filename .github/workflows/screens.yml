name: screens
# Simulator screenshots of every screen, pushed to the ci-screens branch.
# Runs when a commit message contains [screens].
on:
  push:
    branches-ignore: [main, testflight, ci-screens, appstore-screens]

jobs:
  screens:
    if: contains(github.event.head_commit.message, '[screens]')
    runs-on: macos-26
    timeout-minutes: 40
    permissions:
      contents: write
    # A branch named appstore/... makes the App Store set instead: the 6.9-inch iPhone 17 Pro Max (1320 x 2868),
    # the listing's screens only, published to the appstore-screens branch.
    env:
      DEVICE: ${{ startsWith(github.ref_name, 'appstore/') && 'iPhone 17 Pro Max' || 'iPhone 17 Pro' }}
      OUT: ${{ startsWith(github.ref_name, 'appstore/') && 'appstore-screens' || 'ci-screens' }}
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      - name: Build for the simulator
        run: |
          brew install xcodegen && xcodegen generate
          SIM=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS-26' in k for x in v if (x['name'] == '$DEVICE' if '$DEVICE'.endswith('Max') else x['name'].startswith('$DEVICE'))) if any('iOS-26' in k for k in d) else '')")
          [ -z "$SIM" ] && SIM=$(xcrun simctl list devices available iPhone | grep -Eo '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}' | head -1)
          echo "SIM=$SIM" >> $GITHUB_ENV
          set -o pipefail
          xcodebuild -project Shoebox.xcodeproj -scheme Shoebox -destination "id=$SIM" -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 \
            || { grep -E "error:" build.log | sort -u | head -30 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
      - name: Real photos for the App Store set (from Pixabay, through the app's relay)
        if: startsWith(github.ref_name, 'appstore/')
        run: |
          mkdir -p "$RUNNER_TEMP/demo-photos"
          for pair in "trail:coastal hiking trail" "bread:sourdough bread loaf" "castiron:cast iron skillet"; do
            name="${pair%%:*}"; q="${pair#*:}"
            url=$(curl -fsS -H "Origin: https://inmyshoebox.com" --get --data-urlencode "q=$q" --data-urlencode "n=3" https://api.inmyshoebox.com/stock \
              | python3 -c "import json,sys; p=json.load(sys.stdin).get('photos') or []; print(p[0]['url'] if p else '')") || url=""
            if [ -n "$url" ]; then curl -fsSL "$url" -o "$RUNNER_TEMP/demo-photos/$name.jpg" && echo "$name: ok"; else echo "::warning::No photo for $name"; fi
          done
      - name: Screenshots
        run: |
          if [ "$OUT" = appstore-screens ]; then Scripts/appstore-screens.sh "$SIM" "$RUNNER_TEMP/demo-photos"; exit 0; fi
          Scripts/screens.sh "$SIM"
      - name: Publish the screens
        run: |
          cd screens
          git init -q && git checkout -q -b "$OUT"
          git add . && git -c user.name=ci -c user.email=ci@example.com commit -qm "Screens for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$OUT"
          echo "::notice::Screens for ${GITHUB_SHA::7}"
