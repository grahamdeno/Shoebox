name: ios

on:
  pull_request:
  push:
    branches: [main]

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the relay's packages
        working-directory: relay/app
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Relay tests
        run: node --test relay/app/test/*.test.mjs
      - name: The sealed-mail vector must match what the tests write
        run: |
          git status --porcelain -- relay/app/test/vectors
          test -z "$(git status --porcelain -- relay/app/test/vectors)"

  build-and-test:
    runs-on: macos-26
    env:
      # A released Xcode, pinned. The macos-26 image has 26.6 (default) and 26.5. Change it here, and in testflight.yml.
      XCODE_APP: /Applications/Xcode_26.6.app
    steps:
      - uses: actions/checkout@v4

      - name: Select the pinned Xcode
        run: Scripts/ci-select-xcode.sh

      - name: Core rules tests
        run: |
          set -o pipefail
          swift test --package-path Core 2>&1 | tail -n 40

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the project
        run: xcodegen generate

      - name: Pick an iPhone simulator on iOS 26
        id: sim
        run: |
          UDID=$(Scripts/ci-pick-simulator.sh)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Shoebox.xcodeproj \
            -scheme Shoebox \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            | tail -n 120
