name: ios

# Saves Mac minutes (the repo is private: about 190 a month on GitHub Free, then jobs stop until the 1st).
# The Mac build and tests run once when a pull request opens, on a push whose message has [test], or by hand.
# Later pushes to an open PR don't rebuild unless they say [test]. Docs-only and website-only PRs skip it.
# The relay tests run on Linux, cost almost nothing, and run on every PR push.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    paths-ignore: ["docs/**", "web/**", "design/**", "**/*.md"]
  push:
    branches-ignore: [main, testflight, ci-screens, ci-audit, ci-audit-baseline]
  workflow_dispatch:

jobs:
  relay:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the relay's packages
        working-directory: relay/app
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Relay tests
        run: node --test relay/app/test/*.test.mjs
      - name: The sealed-mail vector must match what the tests write
        run: |
          git status --porcelain -- relay/app/test/vectors
          test -z "$(git status --porcelain -- relay/app/test/vectors)"

  build-and-test:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.action != 'synchronize') ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[test]'))
    runs-on: macos-26
    env:
      # A released Xcode, pinned. The macos-26 image has 26.6 (default) and 26.5. Change it here, and in testflight.yml.
      XCODE_APP: /Applications/Xcode_26.6.app
    steps:
      - uses: actions/checkout@v4

      - name: Select the pinned Xcode
        run: Scripts/ci-select-xcode.sh

      - name: Core rules tests
        run: |
          set -o pipefail
          swift test --package-path Core 2>&1 | tail -n 40

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the project
        run: xcodegen generate

      - name: Pick an iPhone simulator on iOS 26
        id: sim
        run: |
          UDID=$(Scripts/ci-pick-simulator.sh)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Shoebox.xcodeproj \
            -scheme Shoebox \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            | tail -n 120
