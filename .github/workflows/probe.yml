name: probe
on:
  push:
    branches: ['probe/**']
jobs:
  stock:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the relay for photos
        run: |
          for q in "pizza" "skillet" "coffee cup" "soccer field" "coastal hiking trail" "tickets" "delivery truck"; do
            code=$(curl -s -o body.json -w "%{http_code}" -D headers.txt -H "Origin: https://inmyshoebox.com" --get --data-urlencode "q=$q" --data-urlencode "n=3" https://api.inmyshoebox.com/stock)
            n=$(python3 -c "import json; print(len(json.load(open('body.json')).get('photos') or []))" 2>/dev/null || echo "?")
            echo "$q -> HTTP $code, photos $n, $(grep -i '^x-cache' headers.txt | tr -d '\r'), $(head -c 160 body.json)"
            sleep 2
          done
