# Shoebox 2.0, native. `xcodegen generate` makes Shoebox.xcodeproj (not checked in).
# Same bundle ids as 1.0, so 2.0 is an update and can read 1.0's backups.
name: Shoebox
options:
  bundleIdPrefix: com.grahamdeno
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  ShoeboxCore:
    path: Core
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 7MHDTK68M2
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Shoebox:
    type: application
    platform: iOS
    sources:
      - App/Shoebox
      - Shared
    dependencies:
      - package: ShoeboxCore
      - target: ShoeboxShare
    entitlements:
      path: App/Shoebox.entitlements
      properties:
        com.apple.security.application-groups: [group.com.grahamdeno.shoebox]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.grahamdeno.shoebox]
        com.apple.developer.ubiquity-container-identifiers: [iCloud.com.grahamdeno.shoebox]
        com.apple.developer.icloud-services: [CloudDocuments]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grahamdeno.shoebox
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Shoebox
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "To keep a photo you pick."
  ShoeboxShare:
    type: app-extension
    platform: iOS
    sources:
      - Share
      - Shared
    dependencies:
      - package: ShoeboxCore
    entitlements:
      path: Share/Share.entitlements
      properties:
        com.apple.security.application-groups: [group.com.grahamdeno.shoebox]
    info:
      path: Share/Info.plist
      properties:
        CFBundleDisplayName: Shoebox
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 10
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grahamdeno.shoebox.share
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
  ShoeboxTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - App/ShoeboxTests
    dependencies:
      - target: Shoebox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grahamdeno.shoebox.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Shoebox:
    build:
      targets:
        Shoebox: all
    test:
      targets:
        - ShoeboxTests
