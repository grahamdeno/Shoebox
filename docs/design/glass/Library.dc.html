<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shoebox library, under the lid</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input::placeholder{color:rgba(241,233,216,0.55)}
input:focus{outline:2px solid #F9C93A;outline-offset:2px}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #3B2240; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; color: #F1E9D8;">
  <img src="/_blob/b0043549d3875705321a2c85d0660139" alt="" style="position: absolute; left: -40px; top: -40px; width: 470px; height: 924px; object-fit: cover; object-position: 50% 40%; filter: blur(18px) saturate(1.2);">
  <div aria-hidden="true" style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: rgba(26,16,32,0.45);"></div>

  <div style="position: absolute; left: 0; right: 0; top: 92px; bottom: 0; border-radius: 28px 28px 0 0; background: rgba(59,34,64,0.80); backdrop-filter: blur(30px) saturate(1.6); -webkit-backdrop-filter: blur(30px) saturate(1.6); border-top: 1px solid rgba(241,233,216,0.18); box-shadow: inset 0 1px 0 rgba(241,233,216,0.14);"></div>

  <div aria-hidden="true" style="position: absolute; left: 12px; right: 12px; top: 58px; height: 44px; border-radius: 8px; background: linear-gradient(180deg, #FFEAA8 0%, #FBD457 10%, #F9C93A 30%, #F7C535 56%, #D9A722 57%, #D4A21E 75%, #C2921A 100%); box-shadow: inset 0 1px 0 rgba(255,250,232,0.95), inset 0 -1px 0 rgba(120,80,10,0.35), 0 3px 4px rgba(26,16,32,0.4), 0 12px 20px rgba(26,16,32,0.55); transform: rotate(-7deg); transform-origin: 0 50%;">
    <span style="position: absolute; left: 0; top: 0; width: 12px; height: 58px; border-radius: 8px 2px 3px 3px; background: linear-gradient(90deg, #E0AE28 0%, #D4A21E 55%, #B8891A 100%); box-shadow: inset 1px 1px 0 rgba(255,236,170,0.75), 0 6px 10px rgba(26,16,32,0.45);"></span>
    <span style="position: absolute; right: 0; top: 0; width: 12px; height: 58px; border-radius: 2px 8px 3px 3px; background: linear-gradient(90deg, #B8891A 0%, #D4A21E 45%, #E0AE28 100%); box-shadow: inset -1px 1px 0 rgba(255,236,170,0.75), 0 6px 10px rgba(26,16,32,0.45);"></span>
  </div>

  <div style="position: absolute; left: 0; right: 0; top: 122px; bottom: 0; overflow-y: auto; padding: 0 22px 120px;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <button style="font-size: 17px; font-weight: 600; min-height: 44px;">Today</button>
      <button style="font-size: 17px; min-height: 44px;">Settings</button>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: baseline; margin: 4px 0 18px;">
      <h1 style="margin: 0; font-size: 36px; font-weight: 700; letter-spacing: -0.8px;">Shoebox</h1>
      <button style="font-size: 17px; font-weight: 600; min-height: 44px;">Put away (27)</button>
    </div>

    <sc-if value="{{hasComing}}" hint-placeholder-val="{{ true }}">
      <h2 style="margin: 6px 0 4px; font-size: 13px; font-weight: 600; letter-spacing: 1.2px; color: rgba(241,233,216,0.7);">COMING UP</h2>
      <sc-for list="{{coming}}" as="r" hint-placeholder-count="6">
        <button style="width: 100%; display: flex; gap: 16px; align-items: center; text-align: left; padding: 12px 0; border-bottom: 1px solid rgba(241,233,216,0.10); min-height: 64px;">
          <span style="width: 40px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center;">
            <span style="font-size: 11px; font-weight: 600; letter-spacing: 1px; color: rgba(241,233,216,0.65);">{{r.mon}}</span>
            <span style="font-size: 24px; font-weight: 500; line-height: 28px; color: {{r.dayColor}};">{{r.day}}</span>
          </span>
          <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0;">
            <span style="font-size: 17px; line-height: 22px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">{{r.words}}</span>
            <span style="font-size: 14px; color: rgba(241,233,216,0.62);">{{r.from}}</span>
          </span>
        </button>
      </sc-for>
    </sc-if>

    <sc-if value="{{hasElse}}" hint-placeholder-val="{{ true }}">
      <h2 style="margin: 26px 0 4px; font-size: 13px; font-weight: 600; letter-spacing: 1.2px; color: rgba(241,233,216,0.7);">EVERYTHING ELSE</h2>
      <sc-for list="{{rest}}" as="r" hint-placeholder-count="4">
        <button style="width: 100%; display: flex; gap: 14px; align-items: center; text-align: left; padding: 12px 0; border-bottom: 1px solid rgba(241,233,216,0.10); min-height: 64px;">
          <sc-if value="{{r.pic}}" hint-placeholder-val="{{ false }}">
            <img src="/_blob/b0043549d3875705321a2c85d0660139" alt="" style="width: 52px; height: 52px; border-radius: 10px; object-fit: cover; flex-shrink: 0;">
          </sc-if>
          <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0;">
            <span style="font-size: 17px; line-height: 22px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">{{r.words}}</span>
            <span style="font-size: 14px; color: rgba(241,233,216,0.62);">{{r.from}}</span>
          </span>
        </button>
      </sc-for>
    </sc-if>

    <sc-if value="{{none}}" hint-placeholder-val="{{ false }}">
      <p style="margin: 40px 0 0; font-size: 17px; color: rgba(241,233,216,0.7);">Nothing in your Shoebox says that.</p>
    </sc-if>
  </div>

  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 130px; background: linear-gradient(180deg, rgba(59,34,64,0) 0%, rgba(59,34,64,0.9) 60%);"></div>
  <label style="position: absolute; left: 16px; right: 16px; bottom: 30px; height: 50px; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-radius: 18px; background: rgba(241,233,216,0.12); backdrop-filter: blur(24px) saturate(1.7); -webkit-backdrop-filter: blur(24px) saturate(1.7); box-shadow: inset 0 1px 0 rgba(241,233,216,0.22), 0 10px 22px rgba(26,16,32,0.35);">
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="rgba(241,233,216,0.7)" stroke-width="2" stroke-linecap="round"><circle cx="7.5" cy="7.5" r="5.5"></circle><line x1="11.8" y1="11.8" x2="16" y2="16"></line></svg>
    <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Search everything</span>
    <input type="search" placeholder="Search everything" value="{{q}}" onChange="{{onQuery}}" style="flex-grow: 1; min-width: 0; background: transparent; border: 0; color: #F1E9D8; font: inherit; font-size: 17px; height: 44px; outline: none;">
  </label>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { q: '' };
    this.onQuery = (e) => this.setState({ q: e.target.value });
    this.today = new Date(2026, 10, 4);
    this.coming = [
      { m: 10, d: 6, words: 'Permission form due Friday', from: 'yesterday, from MGMS Band' },
      { m: 10, d: 6, words: 'Washer and dryer delivery', from: 'yesterday, via your Shoebox email' },
      { m: 10, d: 10, words: 'Enchanted Airlie tickets', from: 'yesterday, via your Shoebox email' },
      { m: 10, d: 23, words: '$100 security deposit', from: 'yesterday, from MGMS Band' },
      { m: 10, d: 26, words: 'Birthday dessert board', from: 'last week, from Boarderie' },
      { m: 10, d: 27, words: 'VA Video Connect visit', from: '4 days ago, via your Shoebox email' },
      { m: 11, d: 3, words: 'The Margot', from: 'last week, from UrbanStems' },
      { m: 11, d: 22, words: 'Orthodontist check-up', from: '2 days ago, from your photos' },
      { m: 0, d: 1, y: 2027, words: 'Watch bands in the cart', from: '2 days ago, from cnswatchbands.com' }
    ];
    this.rest = [
      { words: 'Move the Charles Schwab account', from: 'yesterday, via your Shoebox email', pic: false },
      { words: 'Complete the emergency contact form', from: '5 days ago, via your Shoebox email', pic: false },
      { words: 'Recipe for lunch some day', from: 'Matthew McConaughey tuna salad recipe, last week', pic: true },
      { words: 'Trip dates: Friday', from: 'yesterday, from MGMS Band', pic: false }
    ];
  }
  renderVals() {
    const q = this.state.q.trim().toLowerCase();
    const hit = (r) => !q || (r.words + ' ' + r.from).toLowerCase().includes(q);
    const months = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
    const coming = this.coming.filter(hit).map((r) => {
      const when = new Date(r.y || 2026, r.m, r.d);
      const days = Math.round((when - this.today) / 86400000);
      return { mon: months[r.m], day: r.d, words: r.words, from: r.from, dayColor: days <= 7 ? '#F9C93A' : '#F1E9D8' };
    });
    const rest = this.rest.filter(hit);
    return {
      q: this.state.q, onQuery: this.onQuery,
      coming: coming, rest: rest,
      hasComing: coming.length > 0, hasElse: rest.length > 0, none: coming.length + rest.length === 0
    };
  }
}
</script>
</body>
</html>
